name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Not lts/* (now Node 26): isolated-vm 6.1.2 (via n8n's expression-runtime) doesn't compile on Node 26.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Check formatting
        run: 'npm run format:check'

      - name: Run build
        run: 'npm run build'

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Not lts/* (now Node 26): isolated-vm 6.1.2 (via n8n's expression-runtime) doesn't compile on Node 26.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run tests
        run: 'npm run test'

  contract-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Not lts/* (now Node 26): isolated-vm 6.1.2 (via n8n's expression-runtime) doesn't compile on Node 26.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run contract tests against the published OpenAPI spec
        run: 'npm run test:contract'

  # Runs n8n's own community-package scanner (the check n8n applies when a node is submitted for
  # verification) against a packed build of the package.
  cloud-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Not lts/* (now Node 26): isolated-vm 6.1.2 (via n8n's expression-runtime) doesn't compile on Node 26.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Scan the package with n8n's community-node checks
        run: 'npm run cloud-scan'

  # The lockfile pins the supported floor (n8n 2.16); this job checks the n8n-workflow/n8n-core
  # versions the latest n8n release ships.
  latest-n8n:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Not lts/* (now Node 26): isolated-vm 6.1.2 (via n8n's expression-runtime) doesn't compile on Node 26.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Upgrade n8n-workflow and n8n-core to the versions the latest n8n ships
        # Not n8n-workflow@latest / n8n-core@latest: those npm tags lag far behind n8n itself (2.16
        # vs 2.45 at the time of writing), so read the versions from n8n@latest's dependencies.
        run: |
          WORKFLOW=$(npm view n8n@latest dependencies.n8n-workflow)
          CORE=$(npm view n8n@latest dependencies.n8n-core)
          [ -n "$WORKFLOW" ] && [ -n "$CORE" ] || { echo "Could not read n8n@latest's dependencies"; exit 1; }
          echo "Testing against n8n $(npm view n8n@latest version): n8n-workflow $WORKFLOW, n8n-core $CORE"
          npm install --no-save "n8n-workflow@$WORKFLOW" "n8n-core@$CORE"

      - name: Build and test
        run: 'npm run build && npm run test'
