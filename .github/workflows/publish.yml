# Publishes the community node packages in this monorepo to npm on version tag
# pushes. Each package is released and tagged independently; each job below is
# gated on its package's tag prefix.
#
# n8n requires community nodes to be published from GitHub Actions with npm
# provenance (from May 1 2026). `npm run release` passes the provenance flag,
# which needs @n8n/node-cli >= 0.23.0 in both packages.
#
# npm authentication, per package on npmjs.com:
#   - Preferred: OIDC Trusted Publishing. Add this repository and workflow
#     (publish.yml) as a Trusted Publisher and leave NPM_TOKEN unset.
#   - Fallback: a granular automation token with read/write access to both
#     packages, stored as the NPM_TOKEN repository secret.
#
# Tags are prefixed per package:
#   haystack-enterprise-v<version>       e.g. haystack-enterprise-v0.2.0
#   haystack-enterprise-mcp-v<version>   e.g. haystack-enterprise-mcp-v0.1.0
#
# Release by hand per package (`n8n-node release`'s local flow does not know
# about the prefixed tags):
#   npm run lint -w packages/<name> && npm run build -w packages/<name>
#   # haystack-enterprise only: npm run test:contract
#   # bump "version" in packages/<name>/package.json, update its CHANGELOG.md
#   git commit -am "release: <name> v<version>"
#   git tag <name>-v<version>
#   git push && git push origin <name>-v<version>
#
# The haystack-enterprise job also runs the contract tests
# (packages/contract-tests) before publishing.

name: Publish

on:
  push:
    tags:
      - 'haystack-enterprise-v*.*.*'
      - 'haystack-enterprise-mcp-v*.*.*'

jobs:
  publish-haystack-enterprise:
    name: Publish n8n-nodes-haystack-enterprise
    if: startsWith(github.ref_name, 'haystack-enterprise-v')
    runs-on: ubuntu-latest

    permissions:
      # id-token: OIDC token for npm provenance
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run contract tests against the published OpenAPI spec
        run: 'npm run test:contract'

      - name: Release
        # Lint and build run as part of `n8n-node release`. With NPM_TOKEN
        # unset, npm authenticates via OIDC.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release -w packages/haystack-enterprise
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-haystack-enterprise-mcp:
    name: Publish n8n-nodes-haystack-enterprise-mcp
    if: startsWith(github.ref_name, 'haystack-enterprise-mcp-v')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release -w packages/haystack-enterprise-mcp
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
